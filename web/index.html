<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhillyAlert</title>
    <meta name="description" content="PhillyAlert watches Philadelphia for outages, fires and floods by counting which Wi-Fi routers drop out of location databases, neighborhood by neighborhood." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <script>
      // Apply the OS color scheme before first paint to avoid a flash.
      (function () {
        var mq = matchMedia('(prefers-color-scheme: dark)');
        var apply = function () { document.documentElement.classList.toggle('dark', mq.matches); };
        apply();
        mq.addEventListener('change', apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
